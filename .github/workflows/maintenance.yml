name: Dependency Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  audit:
    name: Audit and outdated dependency report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run maintenance checks
        run: npm run maintenance
