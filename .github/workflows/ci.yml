name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    name: Typecheck, build, and local QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      AVIATIONSTACK_DISABLED: "true"
      ROUTING_API_TIMEOUT_MS: "1200"
      ROUTING_PROVIDER_COOLDOWN_SECONDS: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Local app QA
        run: npm run qa:local
