<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("irieverse_theme");
          const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(theme);
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>IrieVerse · Jamaica Trip Planner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="IrieVerse is a Jamaica-first trip planner for exploring places, mapping routes, saving ideas, and building shareable trips."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IrieVerse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="IrieVerse · Jamaica Trip Planner" />
    <meta
      property="og:description"
      content="Explore Jamaica, map real road routes, save ideas, and build shareable trips."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://irieverse.vercel.app/" />
    <meta property="og:image" content="https://irieverse.vercel.app/icon-1024.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IrieVerse · Jamaica Trip Planner" />
    <meta
      name="twitter:description"
      content="Explore Jamaica, map real road routes, save ideas, and build shareable trips."
    />
    <meta name="twitter:image" content="https://irieverse.vercel.app/icon-1024.png" />
    <link rel="canonical" href="https://irieverse.vercel.app/" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/icon-1024.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
